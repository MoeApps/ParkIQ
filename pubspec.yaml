name: parkiq
description: Smart Parking Reservation & Access Control App

# Flutter SDK version requirement
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP requests — used to talk to your ESP later
  http: ^1.2.1

  # Shows a QR code widget on the Entry PIN screen
  qr_flutter: ^4.1.0

  # Nice loading spinners
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
